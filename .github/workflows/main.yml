name: Flutter CI/CD (Test & Build)

on:
  push:
    branches: [ master, main ]
  pull_request:
    branches: [ master, main ]
  workflow_dispatch:

jobs:
  build:
    name: Test & Build APK
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Checkout Repository
        uses: actions/checkout@v4

      - name: ☕ Setup Java (JDK 17)
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: 💙 Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: 📄 Ensure .env file exists
        run: |
          if [ ! -f .env ]; then
            touch .env
            echo "# Dummy env created for CI asset bundling" > .env
          fi

      - name: 🔑 Grant Execute Permission to Gradlew
        run: chmod +x android/gradlew || true

      - name: 📦 Install Dependencies
        run: flutter pub get

      - name: 🔍 Static Code Analysis
        run: flutter analyze --no-fatal-infos

      - name: 🧪 Run Unit & Widget Tests
        run: flutter test

      - name: 🔨 Build Android APK (Release)
        env:
          GRADLE_OPTS: "-Dorg.gradle.jvmargs=-Xmx4096m -XX:MaxMetaspaceSize=1024m -Dorg.gradle.daemon=false"
        run: flutter build apk --release -v

      - name: 📤 Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: RoadVision-Release-APK
          path: build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
